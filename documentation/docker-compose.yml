services:
  plantuml:
    image: plantuml/plantuml-server:jetty
    container_name: plantuml-server
    ports:
      - "9000:8080"
    volumes:
      - ./docs/docs/diagrams/include:/include
    environment:
      - PLANTUML_INCLUDE_PATH=/include
    restart: unless-stopped
    networks:
      - warm-house-docs-network

  mkdocs:
    build:
      context: .
    container_name: warm-house-mkdocs
    ports:
      - "9001:8000"
    volumes:
      - ./docs:/docs
    depends_on:
      - plantuml
    networks:
      - warm-house-docs-network

  swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui
    ports:
      - "9002:8080"
    environment:
      - URLS=[{"name":"Device Service","url":"/docs/device_service.yaml"},{"name":"Telemetry Service","url":"/docs/telemetry_service.yaml"}]
    volumes:
      - ./docs/docs/API/openapi:/usr/share/nginx/html/docs
    networks:
      - warm-house-docs-network

  asyncapi-viewer:
    build:
      context: ./asyncapi-viewer
    image: asyncapi-viewer
    command: npm run dev
    volumes:
      - ./docs/docs/API/asyncapi:/app/public
      - ./asyncapi-viewer/src:/app/src
    ports:
      - "9003:3000"
    networks:
      - warm-house-docs-network

networks:
  warm-house-docs-network:
    driver: bridge
