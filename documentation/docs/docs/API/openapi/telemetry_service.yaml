components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Telemetry:
      properties:
        device_id:
          title: Device Id
          type: integer
        event_data:
          additionalProperties: true
          title: Event Data
          type: object
        id:
          anyOf:
            - type: integer
            - type: "null"
          title: Id
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      required:
        - event_data
        - device_id
      title: Telemetry
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
        - loc
        - msg
        - type
      title: ValidationError
      type: object
info:
  title: Telemetry Service API
  version: 0.1.0

servers:
  - url: http://localhost:8000
    description: Development server

openapi: 3.1.0
paths:
  /telemetry/{device_id}:
    get:
      operationId: get_telemetry_telemetry__device_id__get
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            title: Device Id
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Telemetry"
                title: Response Get Telemetry Telemetry  Device Id  Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Telemetry
      tags:
        - telemetry
